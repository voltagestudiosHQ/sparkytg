name: Deploy Beta

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Inject OpenRouter key
        run: |
          ./addkey.sh OPENROUTER_KEY "$OPENROUTER_KEY"
          ./addkey.sh SYSTEM_PROMPT "$SYSTEM_PROMPT"
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}

      - name: Deploy to Telegram Serverless (Beta)
        run: npx tgcloud push --force
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_BETA }}

      - name: Migrate Telegram Cloud schema (Beta)
        run: npx tgcloud migrate --yes
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN_BETA }}
